services:
  api:
    # LocalAI container image
    image: quay.io/go-skynet/local-ai:master

    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_TYPE: core
        BASE_IMAGE: ubuntu:24.04

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      - MODELS_PATH=/models
      - LOCALAI_VRAM_WARM_LIMIT=0

    # LocalAI agent settings
    # - LOCALAI_DISABLE_AGENTS=false
    # - LOCALAI_AGENT_POOL_DEFAULT_MODEL=hermes-3-llama3.1-8b
    # - LOCALAI_AGENT_POOL_ENABLE_SKILLS=true
    # - LOCALAI_AGENT_POOL_ENABLE_LOGS=true
    # - LOCALAI_AGENT_HUB_URL=https://agenthub.localai.io

    volumes:
      - models:/models
      - images:/tmp/generated/images/
      - data:/data
      - backends:/backends
      - configuration:/configuration

    # No startup model specified.
    # Install models separately through the LocalAI API or model gallery.

    # NVIDIA GPU support
    # Uncomment if using NVIDIA Container Toolkit.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, utility]

volumes:
  models:
  images:
  data:
  configuration:
  backends: